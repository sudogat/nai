<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Encuadre Inteligente — Cámara</title>
  <style>
    :root {
      --accent: #ffd700;
      --white-70: rgba(255,255,255,0.7);
      --white-40: rgba(255,255,255,0.4);
      --bg: #000;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100dvh;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Contenedor a pantalla completa en móvil; encuadrado como "phone" en PC */
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
    }
    .phone {
      position: relative;
      width: 100vw;
      height: 100dvh;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 600px) {
      .phone {
        width: min(480px, 95vw);
        height: min(900px, 95vh);
        border-radius: 32px;
        border: 5px solid #222;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      }
    }

    /* ---------- Viewport a pantalla completa ---------- */
    .viewport {
      position: absolute; inset: 0;
      background: #111;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }
    .viewport.dragging { cursor: grabbing; }

    #user-image {
      position: absolute;
      top: 50%; left: 50%;
      transform-origin: center center;
      max-width: none; max-height: none;
      pointer-events: none;
      -webkit-user-drag: none;
      display: none;
      will-change: transform, filter;
    }

    .placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #555; font-size: 14px; text-align: center; padding: 40px;
      z-index: 4;
    }
    .placeholder .big { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }

    /* Guías SVG por preset */
    .guides-layer {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 10;
      transition: opacity 0.2s;
    }
    .guides-layer.hidden { opacity: 0; }
    .guides-layer path,
    .guides-layer line,
    .guides-layer circle,
    .guides-layer polygon,
    .guides-layer rect {
      fill: none;
      stroke: rgba(255,255,255,0.85);
      stroke-width: 1.2;
      stroke-dasharray: 5 4;
      vector-effect: non-scaling-stroke;
    }
    .guides-layer .accent {
      stroke: var(--accent);
      stroke-width: 1.6;
    }
    .guides-layer .soft {
      stroke: rgba(255,255,255,0.5);
      stroke-width: 1;
      stroke-dasharray: 3 3;
    }

    .focus-box {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 68px; height: 68px;
      border: 1.2px solid var(--accent);
      pointer-events: none; z-index: 11;
      display: none;
      opacity: 0.85;
    }
    .focus-box::after {
      content: '☀';
      position: absolute;
      right: -18px; top: calc(50% - 8px);
      font-size: 11px; color: var(--accent);
    }

    /* ---------- Top bar (semi-transparente) ---------- */
    .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: env(safe-area-inset-top, 12px) 16px 12px;
      padding-top: max(12px, env(safe-area-inset-top));
      z-index: 20;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
    }
    .icon-btn {
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: none;
      width: 38px; height: 38px;
      border-radius: 50%;
      color: #fff; font-size: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.active { color: var(--accent); }
    .icon-btn:disabled { opacity: 0.35; }

    .top-left, .top-right { display: flex; gap: 8px; align-items: center; }
    .ratio-chip {
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(6px);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 12px; font-weight: 700;
      cursor: pointer;
    }

    /* ---------- Right side rail (favorito, info) ---------- */
    .side-rail {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px;
      z-index: 15;
    }

    /* ---------- Bottom stack ---------- */
    .bottom {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 20;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    }

    /* Zoom pills */
    .zoom-row {
      display: flex; justify-content: center; align-items: center; gap: 8px;
      padding: 12px 12px 8px;
    }
    .zoom-pill {
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      color: #fff;
      border: none;
      min-width: 40px; height: 34px;
      padding: 0 10px;
      border-radius: 17px;
      font-size: 12px; font-weight: 700;
      cursor: pointer;
      opacity: 0.75;
    }
    .zoom-pill.active {
      background: var(--accent);
      color: #000;
      opacity: 1;
      transform: scale(1.08);
      box-shadow: 0 2px 10px rgba(255,215,0,0.4);
    }

    /* Presets carousel */
    .preset-carousel {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 12px 10px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .preset-carousel::-webkit-scrollbar { display: none; }
    .preset-item {
      flex: 0 0 auto;
      scroll-snap-align: center;
      width: 62px;
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      cursor: pointer;
    }
    .preset-thumb {
      width: 58px; height: 58px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid transparent;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      transition: all 0.15s;
    }
    .preset-item.active .preset-thumb {
      border-color: var(--accent);
      background: rgba(255,215,0,0.12);
    }
    .preset-item.active .preset-name { color: var(--accent); }
    .preset-thumb svg { width: 100%; height: 100%; }
    .preset-name {
      font-size: 10px;
      color: rgba(255,255,255,0.75);
      text-align: center;
      max-width: 62px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Botones principales */
    .cta-row {
      display: flex; gap: 10px;
      padding: 8px 14px 12px;
    }
    .cta {
      flex: 1;
      border: none;
      padding: 12px 10px;
      border-radius: 24px;
      font-weight: 700; font-size: 13px;
      cursor: pointer;
    }
    .cta.upload { background: rgba(255,255,255,0.14); color: #fff; }
    .cta.save {
      background: var(--accent); color: #000;
      box-shadow: 0 4px 12px rgba(255,215,0,0.25);
    }
    .cta:disabled { background: rgba(255,255,255,0.08); color: #555; box-shadow: none; }

    /* Panel plegable (ajustes finos) */
    .adjust-panel {
      position: absolute;
      left: 0; right: 0;
      bottom: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      padding: 12px 16px 8px;
      border-top: 1px solid rgba(255,255,255,0.08);
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.2s, opacity 0.2s;
    }
    .adjust-panel.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .adjust-row {
      display: flex; align-items: center; gap: 10px;
      font-size: 11px; color: #ccc;
      margin-bottom: 6px;
    }
    .adjust-row label { min-width: 62px; display: inline-flex; gap: 4px; }
    .adjust-row input[type="range"] {
      flex: 1; accent-color: var(--accent); min-width: 0;
    }
    .adjust-row .val {
      min-width: 34px; text-align: right;
      color: #888; font-variant-numeric: tabular-nums;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 40%;
      left: 50%;
      transform: translate(-50%, 40px);
      background: rgba(255,215,0,0.95);
      color: #000;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px; font-weight: 700;
      z-index: 100;
      transition: transform 0.25s, opacity 0.25s;
      opacity: 0;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* Botón para abrir/cerrar panel de ajustes */
    .adjust-toggle {
      position: absolute;
      right: 12px;
      bottom: 8px;
      z-index: 21;
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="phone">

      <div class="viewport" id="viewport">
        <div class="placeholder" id="placeholder">
          <div>
            <div class="big">📷</div>
            <div>Toca <b>SUBIR FOTO</b> para empezar</div>
          </div>
        </div>
        <img id="user-image" src="" alt="Tu foto">
        <div class="focus-box" id="focusBox"></div>
        <svg class="guides-layer" id="guidesLayer" viewBox="0 0 300 400" preserveAspectRatio="none"></svg>
      </div>

      <!-- Top bar -->
      <div class="top-bar">
        <div class="top-left">
          <button class="icon-btn" id="flipBtn" title="Voltear foto (espejo)">⇄</button>
          <button class="icon-btn" id="gridBtn" title="Mostrar/ocultar guías">▦</button>
        </div>
        <button class="ratio-chip" id="ratioChip" title="Cambiar relación de aspecto">4:3</button>
        <div class="top-right">
          <button class="icon-btn" id="resetBtn" title="Restablecer" disabled>⟳</button>
        </div>
      </div>

      <!-- Rail derecho -->
      <div class="side-rail">
        <button class="icon-btn" id="rotateLeftBtn" title="Rotar -90°" disabled>↺</button>
        <button class="icon-btn" id="rotateRightBtn" title="Rotar +90°" disabled>↻</button>
        <button class="icon-btn" id="favBtn" title="Marcar favorito">♡</button>
      </div>

      <!-- Bottom stack -->
      <div class="bottom">
        <!-- Panel ajustes (plegable) -->
        <div class="adjust-panel" id="adjustPanel">
          <div class="adjust-row">
            <label>↻ Girar</label>
            <input type="range" id="rotateSlider" min="-180" max="180" step="1" value="0">
            <span class="val" id="rotateValue">0°</span>
          </div>
          <div class="adjust-row">
            <label>☀ Brillo</label>
            <input type="range" id="brightSlider" min="50" max="150" step="1" value="100">
            <span class="val" id="brightValue">100%</span>
          </div>
          <div class="adjust-row">
            <label>◐ Contraste</label>
            <input type="range" id="contrastSlider" min="50" max="150" step="1" value="100">
            <span class="val" id="contrastValue">100%</span>
          </div>
          <div class="adjust-row">
            <label>🎨 Filtro</label>
            <select id="filterSelect" style="flex:1;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:6px;padding:4px 6px;font-size:12px;">
              <option value="none">Original</option>
              <option value="bw">Blanco y negro</option>
              <option value="sepia">Sepia</option>
              <option value="vivid">Vivo</option>
              <option value="cold">Frío</option>
              <option value="warm">Cálido</option>
            </select>
          </div>
        </div>

        <button class="icon-btn adjust-toggle" id="adjustToggleBtn" title="Ajustes">⚙</button>

        <!-- Zoom pills -->
        <div class="zoom-row" id="zoomRow">
          <button class="zoom-pill" data-zoom="0.5">.5</button>
          <button class="zoom-pill active" data-zoom="1">1×</button>
          <button class="zoom-pill" data-zoom="2">2×</button>
          <button class="zoom-pill" data-zoom="3">3×</button>
          <button class="zoom-pill" data-zoom="5">5×</button>
        </div>

        <!-- Presets de composición -->
        <div class="preset-carousel" id="presetCarousel"></div>

        <!-- CTA -->
        <div class="cta-row">
          <label class="cta upload">
            📷 SUBIR FOTO
            <input type="file" id="fileInput" accept="image/*" style="display:none;">
          </label>
          <button class="cta save" id="saveBtn" disabled>💾 GUARDAR</button>
        </div>
      </div>

    </div>
  </div>

  <div class="toast" id="toast">Guardado ✓</div>
  <canvas id="renderCanvas" style="display:none;"></canvas>

  <script>
    const $ = (id) => document.getElementById(id);

    // ---------- Presets de composición ----------
    // Cada preset define un SVG en un viewBox 300x400 (se estira al viewport).
    const PRESETS = [
      {
        id: 'thirds',
        name: 'Tercios',
        svg: `
          <line x1="100" y1="0" x2="100" y2="400"/>
          <line x1="200" y1="0" x2="200" y2="400"/>
          <line x1="0" y1="133" x2="300" y2="133"/>
          <line x1="0" y1="267" x2="300" y2="267"/>
        `
      },
      {
        id: 'golden',
        name: 'Áureo',
        svg: `
          <line x1="115" y1="0" x2="115" y2="400"/>
          <line x1="185" y1="0" x2="185" y2="400"/>
          <line x1="0" y1="153" x2="300" y2="153"/>
          <line x1="0" y1="247" x2="300" y2="247"/>
          <path d="M300,0 A300,300 0 0 0 0,300 L0,300 L115,300 A185,185 0 0 1 300,115 Z" class="soft"/>
        `
      },
      {
        id: 'triangle1',
        name: 'Triángulo 1',
        svg: `
          <line x1="100" y1="0" x2="100" y2="400"/>
          <line x1="200" y1="0" x2="200" y2="400"/>
          <line x1="0" y1="133" x2="300" y2="133"/>
          <line x1="0" y1="267" x2="300" y2="267"/>
          <polygon points="30,50 270,50 150,350" class="accent"/>
        `
      },
      {
        id: 'triangle2',
        name: 'Triángulo 2',
        svg: `
          <line x1="0" y1="0" x2="300" y2="400"/>
          <line x1="300" y1="0" x2="0" y2="400"/>
          <polygon points="150,60 260,320 40,320" class="accent"/>
        `
      },
      {
        id: 'two-point',
        name: '2 Puntos',
        svg: `
          <line x1="100" y1="0" x2="100" y2="400"/>
          <line x1="200" y1="0" x2="200" y2="400"/>
          <line x1="0" y1="133" x2="300" y2="133"/>
          <line x1="0" y1="267" x2="300" y2="267"/>
          <circle cx="100" cy="133" r="42" class="accent"/>
          <circle cx="200" cy="267" r="42" class="accent"/>
        `
      },
      {
        id: 'food',
        name: 'Comida',
        svg: `
          <line x1="100" y1="0" x2="100" y2="400"/>
          <line x1="200" y1="0" x2="200" y2="400"/>
          <line x1="0" y1="133" x2="300" y2="133"/>
          <line x1="0" y1="267" x2="300" y2="267"/>
          <circle cx="150" cy="220" r="110" class="accent"/>
          <circle cx="200" cy="140" r="42" class="soft"/>
          <circle cx="90" cy="280" r="50" class="soft"/>
        `
      },
      {
        id: 'portrait',
        name: 'Retrato',
        svg: `
          <line x1="100" y1="0" x2="100" y2="400"/>
          <line x1="200" y1="0" x2="200" y2="400"/>
          <line x1="0" y1="133" x2="300" y2="133"/>
          <line x1="0" y1="267" x2="300" y2="267"/>
          <circle cx="150" cy="133" r="58" class="accent"/>
          <line x1="150" y1="191" x2="150" y2="400" class="soft"/>
        `
      },
      {
        id: 'diagonal',
        name: 'Diagonal',
        svg: `
          <line x1="0" y1="0" x2="300" y2="400" class="accent"/>
          <line x1="0" y1="400" x2="300" y2="0" class="soft"/>
        `
      },
      {
        id: 'center',
        name: 'Central',
        svg: `
          <circle cx="150" cy="200" r="100" class="accent"/>
          <line x1="150" y1="0" x2="150" y2="400" class="soft"/>
          <line x1="0" y1="200" x2="300" y2="200" class="soft"/>
        `
      },
      {
        id: 'symmetry',
        name: 'Simetría',
        svg: `
          <line x1="150" y1="0" x2="150" y2="400" class="accent"/>
          <line x1="0" y1="200" x2="300" y2="200" class="accent"/>
        `
      },
      {
        id: 'lead-lines',
        name: 'Líneas',
        svg: `
          <line x1="0" y1="400" x2="150" y2="150" class="accent"/>
          <line x1="300" y1="400" x2="150" y2="150" class="accent"/>
          <circle cx="150" cy="150" r="30" class="accent"/>
        `
      },
      {
        id: 'clean',
        name: 'Ninguna',
        svg: ``
      }
    ];

    const RATIOS = [
      { key: '4:3', w: 4, h: 3 },
      { key: '3:4', w: 3, h: 4 },
      { key: '1:1', w: 1, h: 1 },
      { key: '16:9', w: 16, h: 9 },
      { key: '9:16', w: 9, h: 16 },
      { key: '3:2', w: 3, h: 2 },
      { key: '2:3', w: 2, h: 3 },
    ];

    const FILTERS = {
      none:  '',
      bw:    'grayscale(1)',
      sepia: 'sepia(0.8)',
      vivid: 'saturate(1.6) contrast(1.1)',
      cold:  'hue-rotate(-15deg) saturate(1.2)',
      warm:  'hue-rotate(15deg) saturate(1.15) brightness(1.05)',
    };

    const state = {
      translateX: 0, translateY: 0,
      scale: 1,
      rotation: 0,
      brightness: 100,
      contrast: 100,
      filter: 'none',
      mirrored: false,
      ratioIndex: 0,
      preset: 'thirds',
      hasImage: false,
      renderW: 0, renderH: 0,
      viewW: 0, viewH: 0,
      guidesVisible: true,
    };

    const originalImageObj = new Image();

    // ---------- Referencias DOM ----------
    const fileInput = $('fileInput');
    const userImage = $('user-image');
    const placeholder = $('placeholder');
    const viewport = $('viewport');
    const guidesLayer = $('guidesLayer');
    const focusBox = $('focusBox');
    const saveBtn = $('saveBtn');
    const resetBtn = $('resetBtn');
    const rotateLeftBtn = $('rotateLeftBtn');
    const rotateRightBtn = $('rotateRightBtn');
    const gridBtn = $('gridBtn');
    const flipBtn = $('flipBtn');
    const favBtn = $('favBtn');
    const ratioChip = $('ratioChip');
    const zoomRow = $('zoomRow');
    const presetCarousel = $('presetCarousel');
    const adjustPanel = $('adjustPanel');
    const adjustToggleBtn = $('adjustToggleBtn');
    const rotateSlider = $('rotateSlider');
    const brightSlider = $('brightSlider');
    const contrastSlider = $('contrastSlider');
    const rotateValue = $('rotateValue');
    const brightValue = $('brightValue');
    const contrastValue = $('contrastValue');
    const filterSelect = $('filterSelect');
    const canvas = $('renderCanvas');
    const toast = $('toast');

    // ---------- Render preset carousel ----------
    function renderPresetCarousel() {
      presetCarousel.innerHTML = PRESETS.map(p => `
        <div class="preset-item ${p.id === state.preset ? 'active' : ''}" data-id="${p.id}">
          <div class="preset-thumb">
            <svg viewBox="0 0 300 400" preserveAspectRatio="none">${p.svg}</svg>
          </div>
          <div class="preset-name">${p.name}</div>
        </div>
      `).join('');
    }
    function applyPresetGuides() {
      const p = PRESETS.find(x => x.id === state.preset);
      guidesLayer.innerHTML = p ? p.svg : '';
    }

    presetCarousel.addEventListener('click', (e) => {
      const item = e.target.closest('.preset-item');
      if (!item) return;
      state.preset = item.dataset.id;
      renderPresetCarousel();
      applyPresetGuides();
      item.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });

    // ---------- Aspect ratio (recorte final) ----------
    function currentRatio() { return RATIOS[state.ratioIndex]; }
    ratioChip.addEventListener('click', () => {
      state.ratioIndex = (state.ratioIndex + 1) % RATIOS.length;
      ratioChip.textContent = currentRatio().key;
      showToast(`Ratio ${currentRatio().key}`);
    });

    // ---------- Viewport (siempre pantalla completa) ----------
    function measureViewport() {
      state.viewW = viewport.clientWidth;
      state.viewH = viewport.clientHeight;
    }
    function recomputeRenderSize() {
      if (!state.hasImage) return;
      const imgA = originalImageObj.width / originalImageObj.height;
      const viewA = state.viewW / state.viewH;
      if (imgA > viewA) {
        state.renderW = state.viewW;
        state.renderH = state.viewW / imgA;
      } else {
        state.renderH = state.viewH;
        state.renderW = state.viewH * imgA;
      }
      userImage.style.width = state.renderW + 'px';
      userImage.style.height = state.renderH + 'px';
    }

    function applyImageTransform() {
      const mirror = state.mirrored ? -1 : 1;
      userImage.style.transform =
        `translate(-50%, -50%) ` +
        `translate(${state.translateX}px, ${state.translateY}px) ` +
        `rotate(${state.rotation}deg) ` +
        `scale(${state.scale * mirror}, ${state.scale})`;
      const f = FILTERS[state.filter];
      const adj = `brightness(${state.brightness}%) contrast(${state.contrast}%)`;
      userImage.style.filter = (f ? f + ' ' : '') + adj;
    }

    function clampPosition() {
      const halfW = (state.renderW * state.scale) / 2;
      const halfH = (state.renderH * state.scale) / 2;
      const maxX = halfW + state.viewW / 2 - 24;
      const maxY = halfH + state.viewH / 2 - 24;
      state.translateX = Math.max(-maxX, Math.min(maxX, state.translateX));
      state.translateY = Math.max(-maxY, Math.min(maxY, state.translateY));
    }

    function updateLabels() {
      rotateValue.textContent = state.rotation + '°';
      brightValue.textContent = state.brightness + '%';
      contrastValue.textContent = state.contrast + '%';
    }
    function updateZoomActive() {
      zoomRow.querySelectorAll('.zoom-pill').forEach(p => {
        p.classList.toggle('active', Math.abs(parseFloat(p.dataset.zoom) - state.scale) < 0.01);
      });
    }

    // ---------- Carga imagen ----------
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        originalImageObj.onload = () => {
          userImage.src = ev.target.result;
          userImage.style.display = 'block';
          placeholder.style.display = 'none';
          focusBox.style.display = 'block';
          state.hasImage = true;
          resetTransform();
          enableControls(true);
          measureViewport();
          recomputeRenderSize();
          applyImageTransform();
          updateZoomActive();
        };
        originalImageObj.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function resetTransform() {
      state.translateX = 0; state.translateY = 0;
      state.scale = 1; state.rotation = 0;
      state.brightness = 100; state.contrast = 100;
      state.mirrored = false; state.filter = 'none';
      rotateSlider.value = 0;
      brightSlider.value = 100;
      contrastSlider.value = 100;
      filterSelect.value = 'none';
      updateLabels();
      updateZoomActive();
    }
    function enableControls(on) {
      [saveBtn, resetBtn, rotateLeftBtn, rotateRightBtn]
        .forEach(el => el.disabled = !on);
    }

    // ---------- Sliders / botones ----------
    rotateSlider.addEventListener('input', (e) => {
      state.rotation = parseInt(e.target.value, 10);
      updateLabels(); applyImageTransform();
    });
    brightSlider.addEventListener('input', (e) => {
      state.brightness = parseInt(e.target.value, 10);
      updateLabels(); applyImageTransform();
    });
    contrastSlider.addEventListener('input', (e) => {
      state.contrast = parseInt(e.target.value, 10);
      updateLabels(); applyImageTransform();
    });
    filterSelect.addEventListener('change', (e) => {
      state.filter = e.target.value;
      applyImageTransform();
    });

    resetBtn.addEventListener('click', () => {
      if (!state.hasImage) return;
      resetTransform();
      applyImageTransform();
      showToast('Restablecido');
    });
    rotateLeftBtn.addEventListener('click', () => {
      state.rotation = ((state.rotation - 90 + 540) % 360) - 180;
      rotateSlider.value = state.rotation;
      updateLabels(); applyImageTransform();
    });
    rotateRightBtn.addEventListener('click', () => {
      state.rotation = ((state.rotation + 90 + 540) % 360) - 180;
      rotateSlider.value = state.rotation;
      updateLabels(); applyImageTransform();
    });
    gridBtn.addEventListener('click', () => {
      state.guidesVisible = !state.guidesVisible;
      guidesLayer.classList.toggle('hidden', !state.guidesVisible);
      focusBox.style.display = state.guidesVisible && state.hasImage ? 'block' : 'none';
      gridBtn.classList.toggle('active', state.guidesVisible);
    });
    flipBtn.addEventListener('click', () => {
      state.mirrored = !state.mirrored;
      flipBtn.classList.toggle('active', state.mirrored);
      applyImageTransform();
    });
    favBtn.addEventListener('click', () => {
      const on = favBtn.classList.toggle('active');
      favBtn.textContent = on ? '♥' : '♡';
    });
    adjustToggleBtn.addEventListener('click', () => {
      adjustPanel.classList.toggle('open');
      adjustToggleBtn.classList.toggle('active');
    });

    // ---------- Zoom pills ----------
    zoomRow.addEventListener('click', (e) => {
      const pill = e.target.closest('.zoom-pill');
      if (!pill || !state.hasImage) return;
      state.scale = parseFloat(pill.dataset.zoom);
      clampPosition();
      applyImageTransform();
      updateZoomActive();
    });

    // ---------- Drag + pinch + wheel ----------
    let dragging = false;
    let dragStartX = 0, dragStartY = 0;
    let baseTX = 0, baseTY = 0;
    let pinchStartDist = 0, pinchStartScale = 1;

    function distance(t1, t2) {
      return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    }

    viewport.addEventListener('touchstart', (e) => {
      if (!state.hasImage) return;
      if (e.touches.length === 2) {
        dragging = false;
        pinchStartDist = distance(e.touches[0], e.touches[1]);
        pinchStartScale = state.scale;
        e.preventDefault();
      } else if (e.touches.length === 1) {
        dragging = true;
        viewport.classList.add('dragging');
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
        baseTX = state.translateX;
        baseTY = state.translateY;
      }
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
      if (!state.hasImage) return;
      if (e.touches.length === 2 && pinchStartDist > 0) {
        const d = distance(e.touches[0], e.touches[1]);
        state.scale = Math.max(0.2, Math.min(8, pinchStartScale * (d / pinchStartDist)));
        clampPosition();
        applyImageTransform();
        updateZoomActive();
        e.preventDefault();
      } else if (dragging && e.touches.length === 1) {
        state.translateX = baseTX + (e.touches[0].clientX - dragStartX);
        state.translateY = baseTY + (e.touches[0].clientY - dragStartY);
        clampPosition();
        applyImageTransform();
        e.preventDefault();
      }
    }, { passive: false });

    let lastTap = 0;
    viewport.addEventListener('touchend', (e) => {
      dragging = false;
      pinchStartDist = 0;
      viewport.classList.remove('dragging');
      const now = performance.now();
      if (now - lastTap < 280 && e.touches.length === 0) quickZoom();
      lastTap = now;
    });

    viewport.addEventListener('mousedown', (e) => {
      if (!state.hasImage) return;
      dragging = true;
      viewport.classList.add('dragging');
      dragStartX = e.clientX; dragStartY = e.clientY;
      baseTX = state.translateX; baseTY = state.translateY;
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      state.translateX = baseTX + (e.clientX - dragStartX);
      state.translateY = baseTY + (e.clientY - dragStartY);
      clampPosition();
      applyImageTransform();
    });
    window.addEventListener('mouseup', () => {
      dragging = false;
      viewport.classList.remove('dragging');
    });

    viewport.addEventListener('wheel', (e) => {
      if (!state.hasImage) return;
      e.preventDefault();
      state.scale = Math.max(0.2, Math.min(8, state.scale + (-e.deltaY * 0.0018)));
      clampPosition();
      applyImageTransform();
      updateZoomActive();
    }, { passive: false });

    viewport.addEventListener('dblclick', () => quickZoom());
    function quickZoom() {
      if (!state.hasImage) return;
      state.scale = state.scale >= 2 ? 1 : 2;
      clampPosition();
      applyImageTransform();
      updateZoomActive();
    }

    // ---------- Guardado (recorte al aspect ratio elegido) ----------
    saveBtn.addEventListener('click', () => {
      if (!state.hasImage) return;
      measureViewport();

      const { w: rw, h: rh } = currentRatio();
      const viewA = state.viewW / state.viewH;
      const targetA = rw / rh;

      // Ventana de recorte dentro del visor, centrada
      let cropW, cropH;
      if (targetA > viewA) {
        cropW = state.viewW;
        cropH = state.viewW / targetA;
      } else {
        cropH = state.viewH;
        cropW = state.viewH * targetA;
      }

      const exportLong = 2200;
      let exportW, exportH;
      if (rw >= rh) {
        exportW = exportLong;
        exportH = Math.round(exportLong * rh / rw);
      } else {
        exportH = exportLong;
        exportW = Math.round(exportLong * rw / rh);
      }

      canvas.width = exportW;
      canvas.height = exportH;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, exportW, exportH);

      const f = FILTERS[state.filter];
      const adj = `brightness(${state.brightness}%) contrast(${state.contrast}%)`;
      ctx.filter = (f ? f + ' ' : '') + adj;

      const scaleMultiplier = exportW / cropW;
      const mirror = state.mirrored ? -1 : 1;

      ctx.save();
      ctx.translate(exportW / 2, exportH / 2);
      ctx.translate(state.translateX * scaleMultiplier, state.translateY * scaleMultiplier);
      ctx.rotate(state.rotation * Math.PI / 180);
      ctx.scale(state.scale * scaleMultiplier * mirror, state.scale * scaleMultiplier);
      ctx.drawImage(originalImageObj, -state.renderW / 2, -state.renderH / 2, state.renderW, state.renderH);
      ctx.restore();
      ctx.filter = 'none';

      const link = document.createElement('a');
      link.download = `encuadre-${currentRatio().key.replace(':','x')}-${state.preset}.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.92);
      link.click();
      showToast('Guardado ✓');
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), 1400);
    }

    // ---------- Init ----------
    function init() {
      renderPresetCarousel();
      applyPresetGuides();
      ratioChip.textContent = currentRatio().key;
      gridBtn.classList.add('active');
      measureViewport();
    }
    window.addEventListener('resize', () => {
      measureViewport();
      recomputeRenderSize();
      clampPosition();
      applyImageTransform();
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        measureViewport();
        recomputeRenderSize();
        clampPosition();
        applyImageTransform();
      }, 200);
    });
    requestAnimationFrame(init);
  </script>
</body>
</html>
