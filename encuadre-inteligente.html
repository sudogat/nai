<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Encuadre Inteligente: componer y guardar fotos con guías profesionales (regla de tercios, áureo, triangular…). Funciona sin conexión.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Encuadre">
  <meta name="mobile-web-app-capable" content="yes">
  <meta property="og:title" content="Encuadre Inteligente">
  <meta property="og:description" content="Compón fotos como un profesional con plantillas de composición.">
  <meta property="og:type" content="website">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon-192.svg">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <title>Encuadre Inteligente Pro</title>
  <style>
    :root {
      --accent: #ffd700;
      --white-70: rgba(255,255,255,0.7);
      --white-40: rgba(255,255,255,0.4);
      --bg: #000;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100dvh;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Contenedor a pantalla completa en móvil; encuadrado como "phone" en PC */
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
    }
    .phone {
      position: relative;
      width: 100vw;
      height: 100dvh;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 600px) {
      .phone {
        width: min(480px, 95vw);
        height: min(900px, 95vh);
        border-radius: 32px;
        border: 5px solid #222;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      }
    }

    /* ---------- Viewport a pantalla completa ---------- */
    .viewport {
      position: absolute; inset: 0;
      background: #111;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }
    .viewport.dragging { cursor: grabbing; }

    #user-image {
      position: absolute;
      top: 50%; left: 50%;
      transform-origin: center center;
      max-width: none; max-height: none;
      pointer-events: none;
      -webkit-user-drag: none;
      display: none;
      will-change: transform, filter;
    }

    .placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #555; font-size: 14px; text-align: center; padding: 40px;
      z-index: 4;
    }
    .placeholder .big { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }

    /* Guías SVG por preset */
    .guides-layer {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 10;
      transition: opacity 0.2s;
    }
    .guides-layer.hidden { opacity: 0; }
    .guides-layer path,
    .guides-layer line,
    .guides-layer circle,
    .guides-layer polygon,
    .guides-layer rect {
      fill: none;
      stroke: rgba(255,255,255,0.85);
      stroke-width: 1.2;
      stroke-dasharray: 5 4;
      vector-effect: non-scaling-stroke;
    }
    .guides-layer .accent {
      stroke: var(--accent);
      stroke-width: 1.6;
    }
    .guides-layer .soft {
      stroke: rgba(255,255,255,0.5);
      stroke-width: 1;
      stroke-dasharray: 3 3;
    }

    .focus-box {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 68px; height: 68px;
      border: 1.2px solid var(--accent);
      pointer-events: none; z-index: 11;
      display: none;
      opacity: 0.85;
    }
    .focus-box::after {
      content: '☀';
      position: absolute;
      right: -18px; top: calc(50% - 8px);
      font-size: 11px; color: var(--accent);
    }

    /* ---------- Top bar (semi-transparente) ---------- */
    .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: env(safe-area-inset-top, 12px) 16px 12px;
      padding-top: max(12px, env(safe-area-inset-top));
      z-index: 20;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
    }
    .icon-btn {
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: none;
      width: 38px; height: 38px;
      border-radius: 50%;
      color: #fff; font-size: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.active { color: var(--accent); }
    .icon-btn:disabled { opacity: 0.35; }

    .top-left, .top-right { display: flex; gap: 8px; align-items: center; }
    .ratio-chip {
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(6px);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 12px; font-weight: 700;
      cursor: pointer;
    }

    /* ---------- Right side rail (favorito, info) ---------- */
    .side-rail {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px;
      z-index: 15;
    }

    /* ---------- Bottom stack ---------- */
    .bottom {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 20;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    }

    /* Zoom pills */
    .zoom-row {
      display: flex; justify-content: center; align-items: center; gap: 8px;
      padding: 12px 12px 8px;
    }
    .zoom-pill {
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      color: #fff;
      border: none;
      min-width: 40px; height: 34px;
      padding: 0 10px;
      border-radius: 17px;
      font-size: 12px; font-weight: 700;
      cursor: pointer;
      opacity: 0.75;
    }
    .zoom-pill.active {
      background: var(--accent);
      color: #000;
      opacity: 1;
      transform: scale(1.08);
      box-shadow: 0 2px 10px rgba(255,215,0,0.4);
    }

    /* Presets carousel */
    .preset-carousel {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 12px 10px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .preset-carousel::-webkit-scrollbar { display: none; }
    .preset-item {
      flex: 0 0 auto;
      scroll-snap-align: center;
      width: 62px;
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      cursor: pointer;
    }
    .preset-thumb {
      width: 58px; height: 58px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid transparent;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      transition: all 0.15s;
    }
    .preset-item.active .preset-thumb {
      border-color: var(--accent);
      background: rgba(255,215,0,0.12);
    }
    .preset-item.active .preset-name { color: var(--accent); }
    .preset-thumb svg { width: 100%; height: 100%; }
    .preset-name {
      font-size: 10px;
      color: rgba(255,255,255,0.75);
      text-align: center;
      max-width: 62px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Botones principales */
    .cta-row {
      display: flex; gap: 10px;
      padding: 8px 14px 12px;
    }
    .cta {
      flex: 1;
      border: none;
      padding: 12px 10px;
      border-radius: 24px;
      font-weight: 700; font-size: 13px;
      cursor: pointer;
    }
    .cta.upload { background: rgba(255,255,255,0.14); color: #fff; }
    .cta.save {
      background: var(--accent); color: #000;
      box-shadow: 0 4px 12px rgba(255,215,0,0.25);
    }
    .cta:disabled { background: rgba(255,255,255,0.08); color: #555; box-shadow: none; }

    /* Panel plegable (ajustes finos) */
    .adjust-panel {
      position: absolute;
      left: 0; right: 0;
      bottom: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      padding: 12px 16px 8px;
      border-top: 1px solid rgba(255,255,255,0.08);
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.2s, opacity 0.2s;
    }
    .adjust-panel.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .adjust-row {
      display: flex; align-items: center; gap: 10px;
      font-size: 11px; color: #ccc;
      margin-bottom: 6px;
    }
    .adjust-row label { min-width: 62px; display: inline-flex; gap: 4px; }
    .adjust-row input[type="range"] {
      flex: 1; accent-color: var(--accent); min-width: 0;
    }
    .adjust-row .val {
      min-width: 34px; text-align: right;
      color: #888; font-variant-numeric: tabular-nums;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 40%;
      left: 50%;
      transform: translate(-50%, 40px);
      background: rgba(255,215,0,0.95);
      color: #000;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px; font-weight: 700;
      z-index: 100;
      transition: transform 0.25s, opacity 0.25s;
      opacity: 0;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* Botón para abrir/cerrar panel de ajustes */
    .adjust-toggle {
      position: absolute;
      right: 12px;
      bottom: 8px;
      z-index: 21;
    }

    /* ---------- Modal / drawer ---------- */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #141414;
      border: 1px solid #262626;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 18px;
    }
    .modal h3 { margin: 0 0 12px; font-size: 16px; }
    .modal h4 { margin: 14px 0 6px; font-size: 13px; color: #ffd700; }
    .modal .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
    .modal input[type="text"], .modal input[type="number"], .modal select {
      flex: 1; background: #1a1a1a; color: #fff;
      border: 1px solid #333; border-radius: 6px;
      padding: 6px 8px; font-size: 12px;
    }
    .modal .close {
      background: #ffd700; color: #000;
      border: none; padding: 10px; border-radius: 8px;
      width: 100%; margin-top: 14px; font-weight: 700; cursor: pointer;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #ffd700, #ff9a00);
      color: #000; font-size: 9px; font-weight: 700;
      padding: 2px 6px; border-radius: 6px;
      vertical-align: middle;
    }
    .pro-lock { position: relative; opacity: 0.55; pointer-events: none; }
    .pro-lock::after {
      content: '🔒 PRO'; position: absolute;
      top: -6px; right: -6px;
      background: #ffd700; color: #000;
      font-size: 9px; font-weight: 700;
      padding: 2px 5px; border-radius: 5px;
    }

    /* Watermark overlay del visor */
    .watermark {
      position: absolute;
      right: 12px; bottom: 12px;
      color: rgba(255,255,255,0.85);
      font-size: 12px; font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      z-index: 12;
      pointer-events: none;
      display: none;
    }
    .watermark.show { display: block; }

    /* Install banner */
    .install-banner {
      position: fixed;
      left: 50%; bottom: 20px;
      transform: translateX(-50%) translateY(120px);
      background: #ffd700; color: #000;
      padding: 10px 16px; border-radius: 22px;
      display: flex; gap: 12px; align-items: center;
      font-size: 12px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 90;
      transition: transform 0.3s;
    }
    .install-banner.show { transform: translateX(-50%) translateY(0); }
    .install-banner button {
      background: #000; color: #ffd700;
      border: none; padding: 6px 12px;
      border-radius: 14px; font-weight: 700; cursor: pointer;
      font-size: 11px;
    }
    .install-banner .x {
      background: transparent; color: #000;
      padding: 4px 6px;
    }

    /* Undo/redo */
    .history-row {
      position: absolute;
      left: 12px; bottom: 8px;
      display: flex; gap: 6px;
      z-index: 21;
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="phone">

      <div class="viewport" id="viewport">
        <div class="placeholder" id="placeholder">
          <div>
            <div class="big">📷</div>
            <div>Toca <b>SUBIR FOTO</b> para empezar</div>
          </div>
        </div>
        <img id="user-image" src="" alt="Tu foto">
        <div class="focus-box" id="focusBox"></div>
        <svg class="guides-layer" id="guidesLayer" viewBox="0 0 300 400" preserveAspectRatio="none"></svg>
      </div>

      <!-- Top bar -->
      <div class="top-bar">
        <div class="top-left">
          <button class="icon-btn" id="flipBtn" data-i18n-title="flip">⇄</button>
          <button class="icon-btn" id="gridBtn" data-i18n-title="grid">▦</button>
          <button class="icon-btn" id="undoBtn" data-i18n-title="undo" disabled>⤺</button>
          <button class="icon-btn" id="redoBtn" data-i18n-title="redo" disabled>⤻</button>
        </div>
        <button class="ratio-chip" id="ratioChip">4:3</button>
        <div class="top-right">
          <button class="icon-btn" id="projectsBtn" data-i18n-title="projects">📁</button>
          <button class="icon-btn" id="settingsBtn" data-i18n-title="settings">⚙</button>
          <button class="icon-btn" id="resetBtn" data-i18n-title="reset" disabled>⟳</button>
        </div>
      </div>

      <!-- Marca de agua -->
      <div class="watermark" id="watermark">Encuadre Inteligente</div>

      <!-- Rail derecho -->
      <div class="side-rail">
        <button class="icon-btn" id="rotateLeftBtn" disabled>↺</button>
        <button class="icon-btn" id="rotateRightBtn" disabled>↻</button>
        <button class="icon-btn" id="shareBtn" data-i18n-title="share" disabled>↗</button>
        <button class="icon-btn" id="favBtn">♡</button>
      </div>

      <!-- Bottom stack -->
      <div class="bottom">
        <!-- Panel ajustes (plegable) -->
        <div class="adjust-panel" id="adjustPanel">
          <div class="adjust-row">
            <label>↻ Girar</label>
            <input type="range" id="rotateSlider" min="-180" max="180" step="1" value="0">
            <span class="val" id="rotateValue">0°</span>
          </div>
          <div class="adjust-row">
            <label>☀ Brillo</label>
            <input type="range" id="brightSlider" min="50" max="150" step="1" value="100">
            <span class="val" id="brightValue">100%</span>
          </div>
          <div class="adjust-row">
            <label>◐ Contraste</label>
            <input type="range" id="contrastSlider" min="50" max="150" step="1" value="100">
            <span class="val" id="contrastValue">100%</span>
          </div>
          <div class="adjust-row">
            <label>🎨 Filtro</label>
            <select id="filterSelect" style="flex:1;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:6px;padding:4px 6px;font-size:12px;">
              <option value="none">Original</option>
              <option value="bw">Blanco y negro</option>
              <option value="sepia">Sepia</option>
              <option value="vivid">Vivo</option>
              <option value="cold">Frío</option>
              <option value="warm">Cálido</option>
            </select>
          </div>
        </div>

        <button class="icon-btn adjust-toggle" id="adjustToggleBtn" title="Ajustes">⚙</button>

        <!-- Zoom pills -->
        <div class="zoom-row" id="zoomRow">
          <button class="zoom-pill" data-zoom="0.5">.5</button>
          <button class="zoom-pill active" data-zoom="1">1×</button>
          <button class="zoom-pill" data-zoom="2">2×</button>
          <button class="zoom-pill" data-zoom="3">3×</button>
          <button class="zoom-pill" data-zoom="5">5×</button>
        </div>

        <!-- Presets de composición -->
        <div class="preset-carousel" id="presetCarousel"></div>

        <!-- CTA -->
        <div class="cta-row">
          <label class="cta upload" id="uploadLabel">
            📷 <span data-i18n="upload">SUBIR FOTO</span>
            <input type="file" id="fileInput" accept="image/*" style="display:none;" multiple>
          </label>
          <button class="cta save" id="saveBtn" disabled>💾 <span data-i18n="save">GUARDAR</span></button>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal ajustes / PRO / marca de agua / exportación -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <h3 data-i18n="settingsTitle">Ajustes</h3>

      <h4 data-i18n="langSection">🌐 Idioma</h4>
      <div class="row">
        <select id="langSelect">
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
      </div>

      <h4>💎 <span data-i18n="proSection">Suscripción PRO</span></h4>
      <div class="row" id="proStatusRow">
        <span id="proStatus" data-i18n="freeVersion">Versión Gratis</span>
      </div>
      <div class="row">
        <input type="text" id="licenseKey" placeholder="License key…">
        <button id="activateBtn" style="background:#ffd700;color:#000;border:none;padding:6px 10px;border-radius:6px;font-weight:700;cursor:pointer;" data-i18n="activate">Activar</button>
      </div>
      <div class="row" style="font-size:11px;color:#888;">
        <span data-i18n="proHint">PRO: sin marca de agua, exportación 4K, PNG/WebP, lote y compartir.</span>
      </div>

      <h4>🖋 <span data-i18n="wmSection">Marca de agua</span></h4>
      <div class="row">
        <label style="display:flex;gap:6px;align-items:center;">
          <input type="checkbox" id="wmEnabled" checked> <span data-i18n="wmShow">Mostrar</span>
        </label>
      </div>
      <div class="row">
        <input type="text" id="wmText" placeholder="Encuadre Inteligente" maxlength="40">
      </div>

      <h4>📤 <span data-i18n="exportSection">Exportación</span></h4>
      <div class="row">
        <label style="min-width:80px;" data-i18n="format">Formato</label>
        <select id="exportFormat">
          <option value="jpeg">JPG</option>
          <option value="png" class="pro-feature">PNG (PRO)</option>
          <option value="webp" class="pro-feature">WebP (PRO)</option>
        </select>
      </div>
      <div class="row">
        <label style="min-width:80px;" data-i18n="resolution">Resolución</label>
        <select id="exportRes">
          <option value="1080">HD 1080</option>
          <option value="2200" selected>2K</option>
          <option value="3200" class="pro-feature">3K (PRO)</option>
          <option value="4096" class="pro-feature">4K (PRO)</option>
        </select>
      </div>
      <div class="row">
        <label style="min-width:80px;" data-i18n="quality">Calidad</label>
        <input type="range" id="exportQuality" min="0.6" max="1" step="0.02" value="0.92" style="flex:1;">
        <span id="exportQualityVal" style="min-width:40px;text-align:right;">92%</span>
      </div>

      <button class="close" id="closeSettings" data-i18n="close">Cerrar</button>
    </div>
  </div>

  <!-- Modal proyectos -->
  <div class="modal-backdrop" id="projectsModal">
    <div class="modal">
      <h3>📁 <span data-i18n="projectsTitle">Proyectos guardados</span></h3>
      <div class="row" style="gap:6px;">
        <input type="text" id="projName" placeholder="Nombre del proyecto…">
        <button id="saveProjBtn" style="background:#ffd700;color:#000;border:none;padding:6px 10px;border-radius:6px;font-weight:700;cursor:pointer;" data-i18n="saveProj">Guardar</button>
      </div>
      <div id="projList" style="margin-top:12px; max-height:50vh; overflow-y:auto;"></div>
      <button class="close" id="closeProjects" data-i18n="close">Cerrar</button>
    </div>
  </div>

  <!-- Banner instalar -->
  <div class="install-banner" id="installBanner">
    <span>📱 <span data-i18n="installMsg">Instalar como app</span></span>
    <button id="installBtn" data-i18n="install">Instalar</button>
    <button class="x" id="installDismiss">✕</button>
  </div>

  <div class="toast" id="toast">Guardado ✓</div>
  <canvas id="renderCanvas" style="display:none;"></canvas>

  <script>
    const $ = (id) => document.getElementById(id);

    // ---------- Presets de composición ----------
    // Cada preset define un SVG en un viewBox 300x400 (se estira al viewport).
    const PRESETS = [
      {
        id: 'thirds',
        name: 'Tercios',
        svg: `
          <line x1="100" y1="0" x2="100" y2="400"/>
          <line x1="200" y1="0" x2="200" y2="400"/>
          <line x1="0" y1="133" x2="300" y2="133"/>
          <line x1="0" y1="267" x2="300" y2="267"/>
        `
      },
      {
        id: 'golden',
        name: 'Áureo',
        svg: `
          <line x1="115" y1="0" x2="115" y2="400"/>
          <line x1="185" y1="0" x2="185" y2="400"/>

      },

      {

      {

      },
      {

        name: 'Diagonal',
        svg: `

        `
      },
      {
        id: 'center',
        name: 'Central',
        svg: `
          <circle cx="150" cy="200" r="100" class="accent"/>
          <line x1="150" y1="0" x2="150" y2="400" class="soft"/>
          <line x1="0" y1="200" x2="300" y2="200" class="soft"/>
        `
      },
      {
        id: 'symmetry',
        name: 'Simetría',
        svg: `
          <line x1="150" y1="0" x2="150" y2="400" class="accent"/>
          <line x1="0" y1="200" x2="300" y2="200" class="accent"/>
        `
      },
      {
        id: 'lead-lines',
        name: 'Líneas',
        svg: `
          <line x1="0" y1="400" x2="150" y2="150" class="accent"/>
          <line x1="300" y1="400" x2="150" y2="150" class="accent"/>
          <circle cx="150" cy="150" r="30" class="accent"/>
        `
      },
      {
        id: 'clean',
        name: 'Ninguna',
        svg: ``
      }
    ];

    const RATIOS = [
      { key: '4:3', w: 4, h: 3 },
      { key: '3:4', w: 3, h: 4 },
      { key: '1:1', w: 1, h: 1 },
      { key: '16:9', w: 16, h: 9 },
      { key: '9:16', w: 9, h: 16 },
      { key: '3:2', w: 3, h: 2 },
      { key: '2:3', w: 2, h: 3 },
    ];

    const FILTERS = {
      none:  '',
      bw:    'grayscale(1)',
      sepia: 'sepia(0.8)',
      vivid: 'saturate(1.6) contrast(1.1)',
      cold:  'hue-rotate(-15deg) saturate(1.2)',
      warm:  'hue-rotate(15deg) saturate(1.15) brightness(1.05)',
    };

    const state = {
      translateX: 0, translateY: 0,
      scale: 1,
      rotation: 0,
      brightness: 100,
      contrast: 100,
      filter: 'none',
      mirrored: false,
      ratioIndex: 0,
      preset: 'thirds',
      hasImage: false,
      renderW: 0, renderH: 0,
      viewW: 0, viewH: 0,
      guidesVisible: true,
    };

    const originalImageObj = new Image();

    // ---------- Referencias DOM ----------
    const fileInput = $('fileInput');
    const userImage = $('user-image');
    const placeholder = $('placeholder');
    const viewport = $('viewport');
    const guidesLayer = $('guidesLayer');
    const focusBox = $('focusBox');
    const saveBtn = $('saveBtn');
    const resetBtn = $('resetBtn');
    const rotateLeftBtn = $('rotateLeftBtn');
    const rotateRightBtn = $('rotateRightBtn');
    const gridBtn = $('gridBtn');
    const flipBtn = $('flipBtn');
    const favBtn = $('favBtn');
    const ratioChip = $('ratioChip');
    const zoomRow = $('zoomRow');
    const presetCarousel = $('presetCarousel');
    const adjustPanel = $('adjustPanel');
    const adjustToggleBtn = $('adjustToggleBtn');
    const rotateSlider = $('rotateSlider');
    const brightSlider = $('brightSlider');
    const contrastSlider = $('contrastSlider');
    const rotateValue = $('rotateValue');
    const brightValue = $('brightValue');
    const contrastValue = $('contrastValue');
    const filterSelect = $('filterSelect');
    const canvas = $('renderCanvas');
    const toast = $('toast');

    // ---------- Render preset carousel ----------
    function renderPresetCarousel() {
      presetCarousel.innerHTML = PRESETS.map(p => `
        <div class="preset-item ${p.id === state.preset ? 'active' : ''}" data-id="${p.id}">
          <div class="preset-thumb">
            <svg viewBox="0 0 300 400" preserveAspectRatio="none">${p.svg}</svg>
          </div>
          <div class="preset-name">${p.name}</div>
        </div>
      `).join('');
    }
    function applyPresetGuides() {
      const p = PRESETS.find(x => x.id === state.preset);
      guidesLayer.innerHTML = p ? p.svg : '';
    }

    presetCarousel.addEventListener('click', (e) => {
      const item = e.target.closest('.preset-item');
      if (!item) return;
      state.preset = item.dataset.id;
      renderPresetCarousel();
      applyPresetGuides();
      item.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });

    // ---------- Aspect ratio (recorte final) ----------
    function currentRatio() { return RATIOS[state.ratioIndex]; }
    ratioChip.addEventListener('click', () => {
      state.ratioIndex = (state.ratioIndex + 1) % RATIOS.length;
      ratioChip.textContent = currentRatio().key;
      showToast(`Ratio ${currentRatio().key}`);
    });

    // ---------- Viewport (siempre pantalla completa) ----------
    function measureViewport() {
      state.viewW = viewport.clientWidth;
      state.viewH = viewport.clientHeight;
    }
    function recomputeRenderSize() {
      if (!state.hasImage) return;
      const imgA = originalImageObj.width / originalImageObj.height;
      const viewA = state.viewW / state.viewH;
      if (imgA > viewA) {
        state.renderW = state.viewW;
        state.renderH = state.viewW / imgA;
      } else {
        state.renderH = state.viewH;
        state.renderW = state.viewH * imgA;
      }
      userImage.style.width = state.renderW + 'px';
      userImage.style.height = state.renderH + 'px';
    }

    function applyImageTransform() {
      const mirror = state.mirrored ? -1 : 1;
      userImage.style.transform =
        `translate(-50%, -50%) ` +
        `translate(${state.translateX}px, ${state.translateY}px) ` +
        `rotate(${state.rotation}deg) ` +
        `scale(${state.scale * mirror}, ${state.scale})`;
      const f = FILTERS[state.filter];
      const adj = `brightness(${state.brightness}%) contrast(${state.contrast}%)`;
      userImage.style.filter = (f ? f + ' ' : '') + adj;
    }

    function clampPosition() {
      const halfW = (state.renderW * state.scale) / 2;
      const halfH = (state.renderH * state.scale) / 2;
      const maxX = halfW + state.viewW / 2 - 24;
      const maxY = halfH + state.viewH / 2 - 24;
      state.translateX = Math.max(-maxX, Math.min(maxX, state.translateX));
      state.translateY = Math.max(-maxY, Math.min(maxY, state.translateY));
    }

    function updateLabels() {
      rotateValue.textContent = state.rotation + '°';
      brightValue.textContent = state.brightness + '%';
      contrastValue.textContent = state.contrast + '%';
    }
    function updateZoomActive() {
      zoomRow.querySelectorAll('.zoom-pill').forEach(p => {
        p.classList.toggle('active', Math.abs(parseFloat(p.dataset.zoom) - state.scale) < 0.01);
      });
    }

    // ---------- Carga imagen ----------
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        originalImageObj.onload = () => {
          userImage.src = ev.target.result;
          userImage.style.display = 'block';
          placeholder.style.display = 'none';
          focusBox.style.display = 'block';
          state.hasImage = true;
          resetTransform();
          enableControls(true);
          measureViewport();
          recomputeRenderSize();
          applyImageTransform();
          updateZoomActive();
        };
        originalImageObj.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function resetTransform() {
      state.translateX = 0; state.translateY = 0;
      state.scale = 1; state.rotation = 0;
      state.brightness = 100; state.contrast = 100;
      state.mirrored = false; state.filter = 'none';
      rotateSlider.value = 0;
      brightSlider.value = 100;
      contrastSlider.value = 100;
      filterSelect.value = 'none';
      updateLabels();
      updateZoomActive();
    }
    function enableControls(on) {
      [saveBtn, resetBtn, rotateLeftBtn, rotateRightBtn]
        .forEach(el => el.disabled = !on);
    }

    // ---------- Sliders / botones ----------
    rotateSlider.addEventListener('input', (e) => {
      state.rotation = parseInt(e.target.value, 10);
      updateLabels(); applyImageTransform();
    });
    brightSlider.addEventListener('input', (e) => {
      state.brightness = parseInt(e.target.value, 10);
      updateLabels(); applyImageTransform();
    });
    contrastSlider.addEventListener('input', (e) => {
      state.contrast = parseInt(e.target.value, 10);
      updateLabels(); applyImageTransform();
    });
    filterSelect.addEventListener('change', (e) => {
      state.filter = e.target.value;
      applyImageTransform();
    });

    resetBtn.addEventListener('click', () => {
      if (!state.hasImage) return;
      resetTransform();
      applyImageTransform();
      showToast('Restablecido');
    });
    rotateLeftBtn.addEventListener('click', () => {
      state.rotation = ((state.rotation - 90 + 540) % 360) - 180;
      rotateSlider.value = state.rotation;
      updateLabels(); applyImageTransform();
    });
    rotateRightBtn.addEventListener('click', () => {
      state.rotation = ((state.rotation + 90 + 540) % 360) - 180;
      rotateSlider.value = state.rotation;
      updateLabels(); applyImageTransform();
    });
    gridBtn.addEventListener('click', () => {
      state.guidesVisible = !state.guidesVisible;
      guidesLayer.classList.toggle('hidden', !state.guidesVisible);
      focusBox.style.display = state.guidesVisible && state.hasImage ? 'block' : 'none';
      gridBtn.classList.toggle('active', state.guidesVisible);
    });
    flipBtn.addEventListener('click', () => {
      state.mirrored = !state.mirrored;
      flipBtn.classList.toggle('active', state.mirrored);
      applyImageTransform();
    });
    favBtn.addEventListener('click', () => {
      const on = favBtn.classList.toggle('active');
      favBtn.textContent = on ? '♥' : '♡';
    });
    adjustToggleBtn.addEventListener('click', () => {
      adjustPanel.classList.toggle('open');
      adjustToggleBtn.classList.toggle('active');
    });

    // ---------- Zoom pills ----------
    zoomRow.addEventListener('click', (e) => {
      const pill = e.target.closest('.zoom-pill');
      if (!pill || !state.hasImage) return;
      state.scale = parseFloat(pill.dataset.zoom);
      clampPosition();
      applyImageTransform();
      updateZoomActive();
    });

    // ---------- Drag + pinch + wheel ----------
    let dragging = false;
    let dragStartX = 0, dragStartY = 0;
    let baseTX = 0, baseTY = 0;
    let pinchStartDist = 0, pinchStartScale = 1;

    function distance(t1, t2) {
      return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    }

    viewport.addEventListener('touchstart', (e) => {
      if (!state.hasImage) return;
      if (e.touches.length === 2) {
        dragging = false;
        pinchStartDist = distance(e.touches[0], e.touches[1]);
        pinchStartScale = state.scale;
        e.preventDefault();
      } else if (e.touches.length === 1) {
        dragging = true;
        viewport.classList.add('dragging');
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
        baseTX = state.translateX;
        baseTY = state.translateY;
      }
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
      if (!state.hasImage) return;
      if (e.touches.length === 2 && pinchStartDist > 0) {
        const d = distance(e.touches[0], e.touches[1]);
        state.scale = Math.max(0.2, Math.min(8, pinchStartScale * (d / pinchStartDist)));
        clampPosition();
        applyImageTransform();
        updateZoomActive();
        e.preventDefault();
      } else if (dragging && e.touches.length === 1) {
        state.translateX = baseTX + (e.touches[0].clientX - dragStartX);
        state.translateY = baseTY + (e.touches[0].clientY - dragStartY);
        clampPosition();
        applyImageTransform();
        e.preventDefault();
      }
    }, { passive: false });

    let lastTap = 0;
    viewport.addEventListener('touchend', (e) => {
      dragging = false;
      pinchStartDist = 0;
      viewport.classList.remove('dragging');
      const now = performance.now();
      if (now - lastTap < 280 && e.touches.length === 0) quickZoom();
      lastTap = now;
    });

    viewport.addEventListener('mousedown', (e) => {
      if (!state.hasImage) return;
      dragging = true;
      viewport.classList.add('dragging');
      dragStartX = e.clientX; dragStartY = e.clientY;
      baseTX = state.translateX; baseTY = state.translateY;
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      state.translateX = baseTX + (e.clientX - dragStartX);
      state.translateY = baseTY + (e.clientY - dragStartY);
      clampPosition();
      applyImageTransform();
    });
    window.addEventListener('mouseup', () => {
      dragging = false;
      viewport.classList.remove('dragging');
    });

    viewport.addEventListener('wheel', (e) => {
      if (!state.hasImage) return;
      e.preventDefault();
      state.scale = Math.max(0.2, Math.min(8, state.scale + (-e.deltaY * 0.0018)));
      clampPosition();
      applyImageTransform();
      updateZoomActive();
    }, { passive: false });

    viewport.addEventListener('dblclick', () => quickZoom());
    function quickZoom() {
      if (!state.hasImage) return;
      state.scale = state.scale >= 2 ? 1 : 2;
      clampPosition();
      applyImageTransform();
      updateZoomActive();
    }

    // ---------- Guardado (recorte al aspect ratio elegido) ----------
    // ---------- Render a canvas (compartido por Guardar + Compartir) ----------
    function renderToCanvas() {
      measureViewport();
      const { w: rw, h: rh } = currentRatio();
      const viewA = state.viewW / state.viewH;
      const targetA = rw / rh;
      let cropW, cropH;
      if (targetA > viewA) { cropW = state.viewW; cropH = state.viewW / targetA; }
      else { cropH = state.viewH; cropW = state.viewH * targetA; }

      const requestedRes = parseInt(document.getElementById('exportRes').value, 10);
      const isPro = ProGate.isPro();
      const cap = isPro ? 4096 : 2200;
      const exportLong = Math.min(requestedRes, cap);
      let exportW, exportH;
      if (rw >= rh) { exportW = exportLong; exportH = Math.round(exportLong * rh / rw); }
      else { exportH = exportLong; exportW = Math.round(exportLong * rw / rh); }

      canvas.width = exportW; canvas.height = exportH;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, exportW, exportH);

      const f = FILTERS[state.filter];
      const adj = `brightness(${state.brightness}%) contrast(${state.contrast}%)`;
      ctx.filter = (f ? f + ' ' : '') + adj;

      const scaleMultiplier = exportW / cropW;
      const mirror = state.mirrored ? -1 : 1;

      ctx.save();
      ctx.translate(exportW / 2, exportH / 2);
      ctx.translate(state.translateX * scaleMultiplier, state.translateY * scaleMultiplier);
      ctx.rotate(state.rotation * Math.PI / 180);
      ctx.scale(state.scale * scaleMultiplier * mirror, state.scale * scaleMultiplier);
      ctx.drawImage(originalImageObj, -state.renderW / 2, -state.renderH / 2, state.renderW, state.renderH);
      ctx.restore();
      ctx.filter = 'none';

      // Marca de agua: gratis obliga, PRO opcional
      const wmEnabled = document.getElementById('wmEnabled').checked;
      const wmText = (document.getElementById('wmText').value || 'Encuadre Inteligente').trim();
      if (!isPro || wmEnabled) {
        const label = isPro ? wmText : (wmText + ' • FREE');
        const size = Math.max(18, Math.floor(exportW * 0.022));
        ctx.font = `700 ${size}px -apple-system, Roboto, sans-serif`;
        ctx.textBaseline = 'bottom';
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(exportW - ctx.measureText(label).width - size*1.8, exportH - size*1.9, ctx.measureText(label).width + size, size*1.5);
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.fillText(label, exportW - size*0.6, exportH - size*0.6);
      }

      const format = document.getElementById('exportFormat').value;
      const quality = parseFloat(document.getElementById('exportQuality').value);
      const useFormat = (!isPro && format !== 'jpeg') ? 'jpeg' : format;
      return { dataURL: canvas.toDataURL('image/' + useFormat, quality), format: useFormat };
    }

    saveBtn.addEventListener('click', () => {
      if (!state.hasImage) return;
      const { dataURL, format } = renderToCanvas();
      const link = document.createElement('a');
      const ext = format === 'jpeg' ? 'jpg' : format;
      link.download = `encuadre-${currentRatio().key.replace(':','x')}-${state.preset}.${ext}`;
      link.href = dataURL;
      link.click();
      showToast(i18n('savedOk'));
    });

    // ---------- Compartir (Web Share API con archivo) ----------
    async function shareCurrent() {
      if (!state.hasImage) return;
      if (!ProGate.gateFeature('share')) return;
      try {
        const { dataURL, format } = renderToCanvas();
        const res = await fetch(dataURL);
        const blob = await res.blob();
        const ext = format === 'jpeg' ? 'jpg' : format;
        const file = new File([blob], `encuadre.${ext}`, { type: 'image/' + format });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Mi encuadre' });
        } else if (navigator.share) {
          await navigator.share({ title: 'Mi encuadre', text: 'Hecho con Encuadre Inteligente' });
        } else {
          showToast(i18n('shareNotSupported'));
        }
      } catch (err) {
        if (err.name !== 'AbortError') showToast('Error: ' + err.message);
      }
    }
    document.getElementById('shareBtn').addEventListener('click', shareCurrent);

    // ---------- Undo / Redo ----------
    const History = (() => {
      const past = [], future = [];
      const MAX = 40;
      let suppress = false;
      const snap = () => ({
        translateX: state.translateX, translateY: state.translateY,
        scale: state.scale, rotation: state.rotation,
        brightness: state.brightness, contrast: state.contrast,
        filter: state.filter, mirrored: state.mirrored,
        preset: state.preset, ratioIndex: state.ratioIndex,
      });
      const apply = (s) => {
        Object.assign(state, s);
        rotateSlider.value = state.rotation;
        brightSlider.value = state.brightness;
        contrastSlider.value = state.contrast;
        filterSelect.value = state.filter;
        ratioChip.textContent = currentRatio().key;
        renderPresetCarousel();
        applyPresetGuides();
        updateLabels();
        updateZoomActive();
        clampPosition();
        applyImageTransform();
      };
      return {
        push() {
          if (suppress) return;
          past.push(snap());
          if (past.length > MAX) past.shift();
          future.length = 0;
          refreshButtons();
        },
        undo() {
          if (past.length < 2) return;
          future.push(past.pop());
          suppress = true; apply(past[past.length - 1]); suppress = false;
          refreshButtons();
        },
        redo() {
          if (!future.length) return;
          const s = future.pop();
          past.push(s);
          suppress = true; apply(s); suppress = false;
          refreshButtons();
        },
        reset() { past.length = 0; future.length = 0; this.push(); refreshButtons(); },
      };
      function refreshButtons() {
        document.getElementById('undoBtn').disabled = past.length < 2;
        document.getElementById('redoBtn').disabled = future.length === 0;
      }
    })();
    document.getElementById('undoBtn').addEventListener('click', () => History.undo());
    document.getElementById('redoBtn').addEventListener('click', () => History.redo());
    // Empuja al historial al soltar sliders o cambiar zoom/rotate
    ['change'].forEach(ev => {
      [rotateSlider, brightSlider, contrastSlider, filterSelect].forEach(el =>
        el.addEventListener(ev, () => History.push()));
    });
    window.addEventListener('mouseup', () => { if (state.hasImage) History.push(); });
    window.addEventListener('touchend', () => { if (state.hasImage) History.push(); });

    // ---------- PRO Gate ----------
    const ProGate = (() => {
      // Clave simple ofuscada (demo). En producción, verificación server-side.
      const validate = (k) => {
        if (!k) return false;
        const norm = k.trim().toUpperCase();
        if (norm === 'DEMO-PRO-2026') return true;
        // Formato: ENC-XXXX-XXXX-XXXX con checksum simple
        if (!/^ENC-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(norm)) return false;
        let sum = 0;
        for (const c of norm.replace(/-/g, '')) sum = (sum * 31 + c.charCodeAt(0)) >>> 0;
        return (sum % 97) === 42;
      };
      return {
        isPro: () => localStorage.getItem('proActive') === '1',
        activate: (k) => {
          if (validate(k)) {
            localStorage.setItem('proActive', '1');
            localStorage.setItem('proKey', k.trim().toUpperCase());
            return true;
          }
          return false;
        },
        deactivate: () => { localStorage.removeItem('proActive'); localStorage.removeItem('proKey'); },
        gateFeature(name) {
          if (this.isPro()) return true;
          showToast(i18n('proRequired'));
          return false;
        },
      };
    })();
    function refreshProUI() {
      const isPro = ProGate.isPro();
      document.getElementById('proStatus').textContent = isPro ? '✅ PRO' : i18n('freeVersion');
      document.querySelectorAll('.pro-feature').forEach(el => {
        el.disabled = !isPro;
      });
      document.getElementById('wmText').disabled = !isPro;
      document.getElementById('wmEnabled').disabled = !isPro;
      updateWatermark();
    }
    document.getElementById('activateBtn').addEventListener('click', () => {
      const key = document.getElementById('licenseKey').value;
      if (ProGate.activate(key)) {
        showToast('PRO ✓');
        refreshProUI();
      } else {
        showToast(i18n('invalidKey'));
      }
    });

    // ---------- Marca de agua overlay ----------
    function updateWatermark() {
      const wm = document.getElementById('watermark');
      const text = (document.getElementById('wmText').value || 'Encuadre Inteligente').trim();
      const isPro = ProGate.isPro();
      const enabled = document.getElementById('wmEnabled').checked;
      wm.textContent = isPro ? text : (text + ' • FREE');
      wm.classList.toggle('show', state.hasImage && (!isPro || enabled));
    }
    document.getElementById('wmText').addEventListener('input', updateWatermark);
    document.getElementById('wmEnabled').addEventListener('change', updateWatermark);

    // ---------- Ajustes modal ----------
    document.getElementById('settingsBtn').addEventListener('click', () => {
      document.getElementById('settingsModal').classList.add('open');
    });
    document.getElementById('closeSettings').addEventListener('click', () => {
      document.getElementById('settingsModal').classList.remove('open');
    });
    document.getElementById('exportQuality').addEventListener('input', (e) => {
      document.getElementById('exportQualityVal').textContent = Math.round(e.target.value * 100) + '%';
    });

    // ---------- Proyectos (localStorage) ----------
    const Projects = {
      key: 'encuadreProjects',
      list() { try { return JSON.parse(localStorage.getItem(this.key) || '[]'); } catch { return []; } },
      save(name, image) {
        const items = this.list();
        items.unshift({
          id: 'p_' + Math.floor(Math.random() * 1e9),
          name, image,
          state: {
            translateX: state.translateX, translateY: state.translateY,
            scale: state.scale, rotation: state.rotation,
            brightness: state.brightness, contrast: state.contrast,
            filter: state.filter, mirrored: state.mirrored,
            preset: state.preset, ratioIndex: state.ratioIndex,
          },
          ts: (typeof performance !== 'undefined' ? performance.timeOrigin + performance.now() : 0),
        });
        // Cuota razonable: máx 12 proyectos guardados
        while (items.length > 12) items.pop();
        localStorage.setItem(this.key, JSON.stringify(items));
      },
      remove(id) {
        localStorage.setItem(this.key, JSON.stringify(this.list().filter(p => p.id !== id)));
      },
      load(id) {
        const p = this.list().find(x => x.id === id);
        if (!p) return;
        originalImageObj.onload = () => {
          userImage.src = p.image;
          userImage.style.display = 'block';
          placeholder.style.display = 'none';
          focusBox.style.display = 'block';
          state.hasImage = true;
          Object.assign(state, p.state);
          rotateSlider.value = state.rotation;
          brightSlider.value = state.brightness;
          contrastSlider.value = state.contrast;
          filterSelect.value = state.filter;
          ratioChip.textContent = currentRatio().key;
          renderPresetCarousel();
          applyPresetGuides();
          measureViewport();
          recomputeRenderSize();
          clampPosition();
          applyImageTransform();
          updateLabels();
          updateZoomActive();
          updateWatermark();
          enableControls(true);
          History.reset();
        };
        originalImageObj.src = p.image;
      },
    };
    function renderProjects() {
      const list = Projects.list();
      const el = document.getElementById('projList');
      if (!list.length) {
        el.innerHTML = `<div style="color:#666;font-size:12px;text-align:center;padding:20px;">${i18n('noProjects')}</div>`;
        return;
      }
      el.innerHTML = list.map(p => `
        <div style="display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #222;">
          <img src="${p.image}" style="width:44px;height:44px;object-fit:cover;border-radius:6px;">
          <div style="flex:1;min-width:0;overflow:hidden;">
            <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(p.name)}</div>
            <div style="font-size:10px;color:#888;">${RATIOS[p.state.ratioIndex].key} · ${p.state.preset}</div>
          </div>
          <button data-load="${p.id}" style="background:#ffd700;color:#000;border:none;padding:5px 8px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;">${i18n('open')}</button>
          <button data-del="${p.id}" style="background:#333;color:#fff;border:none;padding:5px 8px;border-radius:5px;font-size:11px;cursor:pointer;">✕</button>
        </div>
      `).join('');
    }
    function escapeHtml(s) { return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    document.getElementById('projectsBtn').addEventListener('click', () => {
      renderProjects();
      document.getElementById('projectsModal').classList.add('open');
    });
    document.getElementById('closeProjects').addEventListener('click', () => {
      document.getElementById('projectsModal').classList.remove('open');
    });
    document.getElementById('projList').addEventListener('click', (e) => {
      const load = e.target.dataset.load, del = e.target.dataset.del;
      if (load) { Projects.load(load); document.getElementById('projectsModal').classList.remove('open'); }
      if (del) { Projects.remove(del); renderProjects(); }
    });
    document.getElementById('saveProjBtn').addEventListener('click', () => {
      if (!state.hasImage) { showToast(i18n('noImage')); return; }
      const name = document.getElementById('projName').value.trim() || ('Proyecto ' + (Projects.list().length + 1));
      // Guardamos una miniatura del original a 480px para no reventar localStorage
      const thumbCanvas = document.createElement('canvas');
      const maxSide = 480;
      const ratio = originalImageObj.width / originalImageObj.height;
      if (ratio > 1) { thumbCanvas.width = maxSide; thumbCanvas.height = Math.round(maxSide / ratio); }
      else { thumbCanvas.height = maxSide; thumbCanvas.width = Math.round(maxSide * ratio); }
      thumbCanvas.getContext('2d').drawImage(originalImageObj, 0, 0, thumbCanvas.width, thumbCanvas.height);
      Projects.save(name, thumbCanvas.toDataURL('image/jpeg', 0.75));
      renderProjects();
      document.getElementById('projName').value = '';
      showToast(i18n('savedOk'));
    });

    // ---------- i18n ----------
    const STRINGS = {
      es: {
        flip:'Voltear', grid:'Guías', undo:'Deshacer', redo:'Rehacer',
        settings:'Ajustes', reset:'Restablecer', projects:'Proyectos',
        share:'Compartir', upload:'SUBIR FOTO', save:'GUARDAR',
        settingsTitle:'Ajustes', langSection:'Idioma', proSection:'Suscripción PRO',
        freeVersion:'Versión Gratis', activate:'Activar', close:'Cerrar',
        proHint:'PRO: sin marca de agua, exportación 4K, PNG/WebP, lote y compartir.',
        wmSection:'Marca de agua', wmShow:'Mostrar',
        exportSection:'Exportación', format:'Formato', resolution:'Resolución', quality:'Calidad',
        projectsTitle:'Proyectos guardados', saveProj:'Guardar', open:'Abrir',
        noProjects:'No hay proyectos aún.', savedOk:'Guardado ✓', invalidKey:'Clave inválida',
        proRequired:'Función PRO. Activa una licencia.', noImage:'Sube una foto primero',
        shareNotSupported:'Compartir no disponible', installMsg:'Instalar como app', install:'Instalar',
      },
      en: {
        flip:'Flip', grid:'Guides', undo:'Undo', redo:'Redo',
        settings:'Settings', reset:'Reset', projects:'Projects',
        share:'Share', upload:'UPLOAD PHOTO', save:'SAVE',
        settingsTitle:'Settings', langSection:'Language', proSection:'PRO Subscription',
        freeVersion:'Free Version', activate:'Activate', close:'Close',
        proHint:'PRO: no watermark, 4K export, PNG/WebP, batch and share.',
        wmSection:'Watermark', wmShow:'Show',
        exportSection:'Export', format:'Format', resolution:'Resolution', quality:'Quality',
        projectsTitle:'Saved projects', saveProj:'Save', open:'Open',
        noProjects:'No projects yet.', savedOk:'Saved ✓', invalidKey:'Invalid key',
        proRequired:'PRO feature. Activate a license.', noImage:'Upload a photo first',
        shareNotSupported:'Share not supported', installMsg:'Install as app', install:'Install',
      }
    };
    let currentLang = localStorage.getItem('lang') || (navigator.language.startsWith('en') ? 'en' : 'es');
    function i18n(k) { return (STRINGS[currentLang] && STRINGS[currentLang][k]) || STRINGS.es[k] || k; }
    function applyLang() {
      document.documentElement.lang = currentLang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = i18n(el.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        el.title = i18n(el.dataset.i18nTitle);
      });
      refreshProUI();
    }
    document.getElementById('langSelect').addEventListener('change', (e) => {
      currentLang = e.target.value;
      localStorage.setItem('lang', currentLang);
      applyLang();
    });

    // ---------- PWA: Install prompt + Service Worker ----------
    let deferredPrompt = null;
    const installBanner = document.getElementById('installBanner');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (localStorage.getItem('installDismissed') === '1') return;
      setTimeout(() => installBanner.classList.add('show'), 3000);
    });
    document.getElementById('installBtn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      installBanner.classList.remove('show');
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') showToast('App instalada ✓');
      deferredPrompt = null;
    });
    document.getElementById('installDismiss').addEventListener('click', () => {
      installBanner.classList.remove('show');
      localStorage.setItem('installDismissed', '1');
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }

    // Atajos teclado (PC)
    window.addEventListener('keydown', (e) => {
      if (e.target.matches('input, textarea, select')) return;
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); History.undo(); }
      else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) { e.preventDefault(); History.redo(); }
      else if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveBtn.click(); }
      else if (e.key === 'r' && state.hasImage) resetBtn.click();
      else if (e.key === 'g') gridBtn.click();
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), 1400);
    }

    // ---------- Init ----------
    function init() {
      renderPresetCarousel();
      applyPresetGuides();
      ratioChip.textContent = currentRatio().key;
      gridBtn.classList.add('active');
      measureViewport();
      document.getElementById('langSelect').value = currentLang;
      applyLang();
      refreshProUI();
      History.reset();
    }
    window.addEventListener('resize', () => {
      measureViewport();
      recomputeRenderSize();
      clampPosition();
      applyImageTransform();
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        measureViewport();
        recomputeRenderSize();
        clampPosition();
        applyImageTransform();
      }, 200);
    });
    requestAnimationFrame(init);
  </script>
</body>
</html>
